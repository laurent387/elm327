# Broker MQTT Overmind OBD (Mosquitto ≥ 2.0) — à copier dans /etc/mosquitto/conf.d/overmind-obd.conf
# Les chemins /etc/mosquitto/overmind/* sont des EXEMPLES : adaptez-les.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/overmind/passwd
acl_file /etc/mosquitto/overmind/acl

persistence true
persistence_location /var/lib/mosquitto/
# Messages QoS 1 en attente pour l'ingestion si elle redémarre (session persistante)
max_queued_messages 20000
message_size_limit 262144

# 1) Local : service d'ingestion sur le même hôte
listener 1883 127.0.0.1

# 2) Mode A — Tailscale : écoute UNIQUEMENT sur l'IP Tailscale du serveur (100.x.y.z, `tailscale ip -4`)
#    Aucun port ouvert sur la Freebox. Le chiffrement WireGuard de Tailscale protège déjà le lien ;
#    TLS reste possible en plus via le listener 8883 ci-dessous.
listener 1883 100.64.0.1
#           ^^^^^^^^^^ EXEMPLE : remplacer par l'IP Tailscale réelle du serveur

# 3) Mode B — Internet direct : MQTT sur TLS uniquement (port redirigé par la Freebox)
listener 8883 0.0.0.0
certfile /etc/mosquitto/overmind/tls/fullchain.pem
keyfile  /etc/mosquitto/overmind/tls/privkey.pem
tls_version tlsv1.2
# Certificat serveur valide (Let's Encrypt sur un nom de domaine) ; le client Android vérifie strictement.
